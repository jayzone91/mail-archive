name: Checks

on: [push, pull_request]

jobs:
  native:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: extractions/setup-just@v3
      - run: mise exec -- just typecheck lint test smoke
